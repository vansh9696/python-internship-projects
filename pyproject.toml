[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devcheck"
version = "0.1.0"
description = "A deterministic developer-environment health inspector CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vansh Balar" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
devcheck = "devcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]